services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  odoo:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ..:/mnt/extra-addons/govp_for_odoo:ro
      - ./uninstall.py:/opt/govp-tests/uninstall.py:ro
    tmpfs:
      - /var/lib/odoo:uid=100,gid=101,mode=0750
