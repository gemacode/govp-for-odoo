name: Release
on:
  push:
    tags: ['v18.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -v
      - run: bash tests/native-smoke.sh
      - name: Package module
        run: |
          mkdir -p package/govp_for_odoo
          git archive HEAD | tar -x -C package/govp_for_odoo
          rm -rf package/govp_for_odoo/.github package/govp_for_odoo/tests package/govp_for_odoo/package
          cd package
          zip -qr ../govp-for-odoo-18.0.0.1.0.zip govp_for_odoo
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes govp-for-odoo-18.0.0.1.0.zip
        env:
          GH_TOKEN: ${{ github.token }}
