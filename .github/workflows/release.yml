name: Release
on:
  push:
    tags: ['v18.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: bash tests/native-smoke.sh
      - name: Package module
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p package/govp_for_odoo
          git archive HEAD | tar -x -C package/govp_for_odoo
          rm -rf package/govp_for_odoo/.github package/govp_for_odoo/tests package/govp_for_odoo/package
          cd package
          zip -qr "../govp-for-odoo-${VERSION}.zip" govp_for_odoo
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "govp-for-odoo-${GITHUB_REF_NAME#v}.zip"
        env:
          GH_TOKEN: ${{ github.token }}
